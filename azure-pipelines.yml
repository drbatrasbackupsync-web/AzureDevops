trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: azureServiceConnection
    value: 'azure-service-connection' # Azure DevOps Service Connection name
  - name: terraformVersion
    value: '1.15.8'

stages:
  - stage: Validate
    displayName: 'Validate & Security Scanning'
    jobs:
      - job: ValidateTerraform
        displayName: 'Terraform Format, Validate & Security Scan'
        steps:
          - task: HashiCorpInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: PowerShell@2
            displayName: 'Validate Preprod & Prod with Security Checks'
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                Write-Host "==> Running Gitleaks Security Scan for Secrets..."
                curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz
                ./gitleaks detect --source . --verbose

                Write-Host "==> Running TFLint Static Security Analysis..."
                curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
                tflint --init
                tflint

                Write-Host "==> Checking Preprod Infrastructure..."
                Set-Location environments/preprod
                terraform init -backend=false -reconfigure
                terraform fmt -check
                terraform validate

                Write-Host "==> Checking Prod Infrastructure..."
                Set-Location ../prod
                terraform init -backend=false -reconfigure
                terraform fmt -check
                terraform validate

  - stage: Preprod_Plan
    displayName: 'Preprod - Plan'
    dependsOn: Validate
    jobs:
      - job: PlanPreprod
        displayName: 'Terraform Plan Preprod'
        steps:
          - task: HashiCorpInstaller@1
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: AzureCLI@2
            displayName: 'Terraform Init & Plan (Preprod)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              workingDirectory: 'environments/preprod'
              inlineScript: |
                Write-Host "==> Initializing Terraform (Preprod)..."
                terraform init -reconfigure
                Write-Host "==> Planning Terraform Infrastructure (Preprod)..."
                terraform plan -out=preprod.tfplan

  - stage: Preprod_Apply
    displayName: 'Preprod - Apply'
    dependsOn: Preprod_Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyPreprod
        displayName: 'Deploy to Preprod'
        environment: 'preprod'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: HashiCorpInstaller@1
                  inputs:
                    terraformVersion: '$(terraformVersion)'

                - task: AzureCLI@2
                  displayName: 'Terraform Init & Apply (Preprod)'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'pscore'
                    scriptLocation: 'inlineScript'
                    workingDirectory: 'environments/preprod'
                    inlineScript: |
                      Write-Host "==> Initializing Terraform (Preprod)..."
                      terraform init -reconfigure
                      Write-Host "==> Applying Terraform Infrastructure (Preprod)..."
                      terraform apply -auto-approve

  - stage: Prod_Plan
    displayName: 'Prod - Plan'
    dependsOn: Preprod_Apply
    jobs:
      - job: PlanProd
        displayName: 'Terraform Plan Prod'
        steps:
          - task: HashiCorpInstaller@1
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: AzureCLI@2
            displayName: 'Terraform Init & Plan (Prod)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              workingDirectory: 'environments/prod'
              inlineScript: |
                Write-Host "==> Initializing Terraform (Prod)..."
                terraform init -reconfigure
                Write-Host "==> Planning Terraform Infrastructure (Prod)..."
                terraform plan -out=prod.tfplan

  - stage: Prod_Apply
    displayName: 'Prod - Apply'
    dependsOn: Prod_Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyProd
        displayName: 'Deploy to Prod'
        environment: 'prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: HashiCorpInstaller@1
                  inputs:
                    terraformVersion: '$(terraformVersion)'

                - task: AzureCLI@2
                  displayName: 'Terraform Init & Apply (Prod)'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'pscore'
                    scriptLocation: 'inlineScript'
                    workingDirectory: 'environments/prod'
                    inlineScript: |
                      Write-Host "==> Initializing Terraform (Prod)..."
                      terraform init -reconfigure
                      Write-Host "==> Applying Terraform Infrastructure (Prod)..."
                      terraform apply -auto-approve
